<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Código QR - Feria Cultural</title>
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    .hoja-qr {
      text-align: center;
      max-width: 520px;
      margin: 0 auto;
    }
    .hoja-qr h1 { font-size: 2rem; margin-bottom: 4px; }
    .hoja-qr .escanea { font-size: 1.3rem; font-weight: 700; margin: 16px 0; }
    #qr {
      display: inline-block;
      padding: 16px;
      background: var(--blanco);
      border-radius: var(--radio);
    }
    .banderas-qr img { height: 1em; vertical-align: -0.1em; border-radius: 2px; box-shadow: 0 0 0 1px var(--borde); }
    .url { font-size: 0.9rem; color: var(--texto-suave); word-break: break-all; margin: 12px 0 24px; }

    /* Al imprimir, ocultamos el botón */
    @media print {
      .no-imprimir { display: none; }
      body { background: white; }
      .caja { box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <div class="caja hoja-qr">
      <p class="etiqueta" style="background: var(--fondo);">Feria Cultural 2026</p>
      <h1>Software del Río de la Plata</h1>
      <p class="banderas-qr"><img src="img/argentina.svg" alt=""> Mercado Libre · <img src="img/uruguay.svg" alt=""> PedidosYa</p>
      <p class="escanea">Escaneá para participar</p>

      <div id="qr"></div>
      <p class="url" id="texto-url"></p>

      <button class="boton no-imprimir" onclick="window.print()">Imprimir</button>
    </div>
  </main>

  <!-- Librería para generar códigos QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/qr.js"></script>
</body>
</html>
