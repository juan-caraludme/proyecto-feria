<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Software del Río de la Plata</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="encabezado">
    <p class="etiqueta">Feria Cultural 2026</p>
    <h1 class="titulo">Software del Río de la Plata</h1>
    <p class="subtitulo">
      Conocé dos aplicaciones que nacieron en Argentina y Uruguay
      y poné a prueba lo que aprendiste.
    </p>
  </header>

  <main class="contenedor">

    <!-- PASO 1: NOMBRE (opcional) -->
    <section class="paso">
      <h2 class="paso-titulo"><span class="numero">1</span> ¿Cómo te llamás?</h2>
      <input type="text" id="nombre" class="campo" placeholder="Escribí tu nombre (opcional)" maxlength="30" autocomplete="off">
    </section>

    <!-- PASO 2: ELEGIR PAÍS -->
    <section class="paso">
      <h2 class="paso-titulo"><span class="numero">2</span> Elegí un país</h2>

      <div class="tarjetas">
        <button class="tarjeta tarjeta-argentina" data-pais="argentina">
          <span class="bandera">🇦🇷</span>
          <span class="pais">Argentina</span>
          <span class="app">Mercado Libre</span>
          <span class="descripcion">La plataforma de compras y ventas online más grande de Latinoamérica.</span>
          <span class="flecha">Empezar →</span>
        </button>

        <button class="tarjeta tarjeta-uruguay" data-pais="uruguay">
          <span class="bandera">🇺🇾</span>
          <span class="pais">Uruguay</span>
          <span class="app">PedidosYa</span>
          <span class="descripcion">La app de delivery que nació en Montevideo y llegó a toda la región.</span>
          <span class="flecha">Empezar →</span>
        </button>
      </div>
    </section>

  </main>

  <!-- PIE DE PÁGINA (editar con los datos del curso) -->
  <footer class="pie">
    <p>Colegio Caraludmé · 6to · 2026</p>
    <p>Hecho con ❤️ por los estudiantes para la comunidad</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
